# vm1: Kafka (KRaft) + Kafka UI + Producer
# Uruchomienie: docker compose up -d

x-extra-hosts: &extra-hosts
  - "vm1:10.7.11.43"
  - "vm2:10.7.11.44"
  - "vm3:10.7.11.45"
  - "vm4:10.7.11.46"
  - "vm5:10.7.11.47"

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    extra_hosts: *extra-hosts
    ports:
      - "9092:19092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://vm1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_RETENTION_HOURS: 336
      KAFKA_LOG_RETENTION_BYTES: -1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    extra_hosts: *extra-hosts
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: etl-koszela
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    extra_hosts: *extra-hosts
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Tworzę topiki..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic raw.alltick \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=1209600000
        echo "Topiki gotowe:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  producer:
    build:
      context: ../../producer
      dockerfile: Dockerfile
    container_name: producer
    extra_hosts: *extra-hosts
    env_file: ../../producer/.env
    environment:
      SINK_TYPE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw.alltick
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:
