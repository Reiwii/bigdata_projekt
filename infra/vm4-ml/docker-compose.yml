# vm4: Serwis ML (FastAPI + XGBoost + Isolation Forest)
# Uruchomienie: docker compose up -d --build
# Test:         curl http://vm4:8000/health
#               curl -X POST http://vm4:8000/predict
#               curl -X POST http://vm4:8000/detect-anomalies

services:
  ml-service:
    build:
      context: ../../ml
      dockerfile: Dockerfile
    container_name: ml-service
    extra_hosts:
      - "vm1:10.7.11.43"
      - "vm2:10.7.11.44"
      - "vm3:10.7.11.45"
      - "vm4:10.7.11.46"
      - "vm5:10.7.11.47"
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST: vm2
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: analytics          # skąd czytamy gold_*
      ML_DATABASE: ml                   # dokąd piszemy predictions / anomalies / model_runs
      MODEL_DIRECTORY: /models
      CANDLE_MINUTES: 1
      # predykcja (XGBoost)
      FORECAST_HORIZONS: "1,5,15,30,60"
      FORECAST_TRAINING_WINDOW_DAYS: 7
      FORECAST_RETRAIN_INTERVAL_MINUTES: 60
      # anomalie (Isolation Forest)
      ANOMALY_TRAINING_WINDOW_DAYS: 3
      ANOMALY_SCORING_WINDOW_MINUTES: 60
      ANOMALY_CONTAMINATION: 0.03
    volumes:
      - ml_models:/models               # wytrenowany model przeżywa restart kontenera
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ml_models:
