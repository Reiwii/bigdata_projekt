# vm3: Airflow (LocalExecutor) + Postgres (metadata) + dbt
# Uruchomienie: docker compose up -d --build
# UI: http://vm3:8082 (login: airflow / airflow)

x-extra-hosts: &extra-hosts
  - "vm1:10.7.11.43"
  - "vm2:10.7.11.44"
  - "vm3:10.7.11.45"
  - "vm4:10.7.11.46"
  - "vm5:10.7.11.47"

x-airflow-common: &airflow-common
  image: airflow-dbt:local
  extra_hosts: *extra-hosts
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    CLICKHOUSE_HOST: vm2
    CLICKHOUSE_PORT: 8123
    ML_SERVICE_URL: http://vm4:8000
    AIRFLOW_CONN_ML_SERVICE: 'http://vm4:8000'
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../dbt:/opt/airflow/dbt
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Jednorazowy fix uprawnień: katalogi dbt na mount + volume airflow_logs
  dbt-fix-perms:
    image: busybox:1.36
    container_name: dbt-fix-perms
    volumes:
      - ../../dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
    command:
      - sh
      - -c
      - |
        mkdir -p /opt/airflow/dbt/target /opt/airflow/dbt/logs
        chown -R 50000:0 /opt/airflow/dbt/target /opt/airflow/dbt/logs /opt/airflow/logs
        chmod -R 775 /opt/airflow/dbt/target /opt/airflow/dbt/logs /opt/airflow/logs
    restart: "no"

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
      dbt-fix-perms:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8082:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped

volumes:
  pg_data:
  airflow_logs:
