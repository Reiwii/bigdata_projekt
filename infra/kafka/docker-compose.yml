# vm1: Kafka (KRaft) + Kafka UI
# Uruchomienie: docker compose up -d
# Test: docker exec kafka kafka-topics --bootstrap-server localhost:9092 --list

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"       # dostęp z innych VM
      - "9093:9093"       # controller (wewnętrzny)
    environment:
      # KRaft — bez ZooKeepera
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listenery
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://vm1:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Retencja 14 dni
      KAFKA_CFG_LOG_RETENTION_HOURS: 336
      KAFKA_CFG_LOG_RETENTION_BYTES: -1

      # Auto-create topics (wygodne na dev)
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: etl-koszela
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Tworzenie topiku przy pierwszym starcie
  kafka-init:
    image: bitnami/kafka:3.7
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Tworzę topiki..."
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic raw.alltick \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=1209600000
        echo "Topiki gotowe:"
        kafka-topics --bootstrap-server kafka:9092 --list
    restart: "no"

volumes:
  kafka_data:
