# vm2: ClickHouse (bronze + silver + gold + ml)
# Uruchomienie: docker compose up -d

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    extra_hosts:
      - "vm1:10.7.11.43"
      - "vm2:10.7.11.44"
      - "vm3:10.7.11.45"
      - "vm4:10.7.11.46"
      - "vm5:10.7.11.47"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server
      - ./init:/docker-entrypoint-initdb.d
      - ./config/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml
      - ./config/users.xml:/etc/clickhouse-server/users.d/custom-users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ch_data:
  ch_logs:
